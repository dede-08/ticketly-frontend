@if (request(); as req) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/50" (click)="onCancel()"></div>
    <div class="relative bg-white rounded-xl shadow-xl max-w-sm w-full p-6" role="alertdialog">
      <h2 class="text-lg font-bold text-slate-900 mb-2">{{ req.title }}</h2>
      <p class="text-sm text-slate-600 mb-6">{{ req.message }}</p>
      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-200 rounded-md hover:bg-slate-50 transition-colors"
        >
          {{ req.cancelLabel }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
